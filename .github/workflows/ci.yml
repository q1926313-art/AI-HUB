# Build and test every supported platform; release.yml handles packaging.
#
# Modified for AI Hub: preserved platform checks, team workflow checks and
# isolated Linux native mod diagnostics on main.
# Rust caches use one pinned toolchain and only main pushes save, so PR
# caches can't evict the ones everybody restores. setup-zig caches separately.
name: ci

on:
  push:
    branches: [main]
  # No paths-ignore here: CI is required to merge, so every PR needs it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels older runs on the same branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  # In the cache key: ghostty-sys can't tell when Zig changes.
  ZIG_VERSION: 0.16.0
  # File/line backtraces without full debug info: smaller target, faster cache.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  # Incremental state only bloats a cache: CI builds each commit once.
  CARGO_INCREMENTAL: "0"
  SAVE_CACHES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  platform-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match release's glibc floor and native platform runners.
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: macos-aarch64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: AI team unit and runtime checks
        run: node --test scripts/test_team.mjs scripts/test_team_runtime.mjs scripts/test_team_workspace.mjs
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      # The whole target/, like release.yml: rust-cache drops the vendored crates.
      # Keyed by what the dependencies build from, so a source-only push
      # restores an exact hit and saves nothing (no cache per commit).
      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cache-paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ci-v2-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/**', 'crates/**', '.github/workflows/ci.yml') }}
          restore-keys: ci-v2-${{ matrix.platform }}-${{ env.RUST_TOOLCHAIN }}-zig${{ env.ZIG_VERSION }}-
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        # A stuck package mirror fails here in minutes, not at the job's limit.
        timeout-minutes: 10
        run: |
          scripts/ci-apt \
            pkg-config clang libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev \
            xvfb xauth
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Windows installer rollback checks
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install-windows.ps1
      - name: Keep unchanged sources fresh
        run: scripts/ci-sources restore
      # Compile the screenshot harness everywhere, even without a desktop.
      # Disable optimized dev dependencies in CI to reduce test compile time.
      - name: Build tests
        id: build_tests
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0' --no-run
      - name: Note the sources the cache was built from
        if: env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: scripts/ci-sources record
      - name: Save build cache
        if: env.SAVE_CACHES == 'true' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Tests
        run: |
          only=()
          if [ "$RUNNER_OS" != Linux ]; then
            for t in tests/*.rs; do
              name=$(basename "$t" .rs)
              [ "$name" = shot_pixels ] || only+=(--test "$name")
            done
            only+=(--bins)
          fi
          threads=()
          if [ "$RUNNER_OS" = Linux ]; then
            threads=(-- --test-threads 4)
          fi
          cargo test --locked --config 'profile.dev.package."*".opt-level=0' "${only[@]}" "${threads[@]}"
      # Windows runners lack an interactive desktop. Linux uses headless Vulkan
      # in the suite above; macOS exercises the native window renderer here.
      - name: Screenshot pixels
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          HERDR_SHOT_NATIVE_TEST: "1"
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0' --test shot_pixels
      # This checks the real JS engine and eager native materialization.
      # Complete-frame screenshots remain a separate interactive check.
      - name: Check AI team native mod states
        if: runner.os == 'Linux'
        id: team_ui
        timeout-minutes: 8
        run: python3 scripts/test-team-ui.py
      - name: Check release packaging
        if: matrix.platform == 'linux-x86_64'
        run: |
          python3 -m unittest discover -s scripts -p test_distribution.py
          python3 -m unittest discover -s scripts -p test_prepare_release.py
          python3 -m unittest discover -s scripts -p test_publish_release.py
      - name: Install Bun
        if: matrix.platform == 'linux-x86_64'
        run: curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
      - name: Check documentation
        if: matrix.platform == 'linux-x86_64'
        run: |
          ~/.bun/bin/bun test scripts/docs.test.ts
          ~/.bun/bin/bun scripts/docs.ts check
      - name: Upload AI team native diagnostics
        if: always() && runner.os == 'Linux' && steps.team_ui.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Hub-team-ui-linux-x86_64
          path: target/team-ui/*
          if-no-files-found: error
          retention-days: 14
      # Keep a runnable development build for inspecting the actual frame.
      # A failed test must not hide the binary needed to reproduce it.
      - name: Pack Linux debug executable
        if: always() && runner.os == 'Linux' && steps.build_tests.outcome == 'success'
        id: linux_debug
        run: |
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          bundle="$staging/AI-Hub-linux-x86_64-debug"
          mkdir -p "$bundle" target/ci-artifacts
          cp target/debug/herdr-app LICENSE NOTICE THIRD-PARTY-NOTICES "$bundle/"
          {
            git rev-parse HEAD
            target/debug/herdr-app --version
            sha256sum target/debug/herdr-app
            ldd target/debug/herdr-app
          } > "$bundle/build-info.txt"
          tar -czf target/ci-artifacts/AI-Hub-linux-x86_64-debug.tar.gz -C "$staging" AI-Hub-linux-x86_64-debug
      - name: Upload Linux debug executable
        if: always() && runner.os == 'Linux' && steps.linux_debug.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Hub-linux-x86_64-debug
          path: target/ci-artifacts/AI-Hub-linux-x86_64-debug.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Keep the required check name stable while requiring every platform.
  test:
    needs: platform-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.platform-tests.result }}" = success ]'

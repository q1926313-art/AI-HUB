# One-time import. Workflow files are activated separately with the connected GitHub app.
name: Import AI Hub source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-ai-hub.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-hub-initial-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import reviewed source within contents permission
        env:
          EXPECTED_TREE: 9c4133549b5ebf7a7d35a80676219bb6ad04587c
          EXPECTED_PATCH_SHA256: 5decc351284266741943e359b2887ed7c47954cbd20b186b4d45451e10b112ac
        run: |
          set -euo pipefail
          echo "$EXPECTED_PATCH_SHA256  .ai-hub-bootstrap/import.patch" | sha256sum -c -
          patch="$RUNNER_TEMP/ai-hub-import.patch"
          cp .ai-hub-bootstrap/import.patch "$patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/herdrdev/herdr-app.git
          git fetch --no-tags upstream 2d1464e02ddad5484eaaf9a5b59b594e3930aeba
          git read-tree --reset -u FETCH_HEAD
          git apply --index "$patch"
          actual_tree=$(git write-tree)
          test "$actual_tree" = "$EXPECTED_TREE"
          # This runner has contents permission, not workflows permission.
          # Preserve the existing workflow tree byte-for-byte; the connected
          # GitHub app will install the reviewed CI/release files separately.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          test -z "$(git diff --cached --name-only HEAD -- .github/workflows)"
          git diff --cached --check 2d1464e02ddad5484eaaf9a5b59b594e3930aeba
          git commit -m 'feat: import pinned herdr desktop source as ai hub'
          git push origin HEAD:main
          echo "Imported source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed complete tree: $actual_tree" >> "$GITHUB_STEP_SUMMARY"
